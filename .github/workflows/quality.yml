name: Calidad del código

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Obtener el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Crear entorno virtual
        run: python -m venv .venv
      - name: Instalar dependencias
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
      - name: Comprobar dependencias
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Revisar código
        run: .\.venv\Scripts\python.exe -m ruff check .
      - name: Revisar formato
        run: .\.venv\Scripts\python.exe -m ruff format --check .
      - name: Ejecutar pruebas
        run: .\.venv\Scripts\python.exe -m pytest -q
